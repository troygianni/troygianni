<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Troy Conte terminal introduction</title>
  <desc id="desc">A macOS-style terminal showing Troy's current focus.</desc>
  <defs>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="14" fill="url(#window)" stroke="#30363d" stroke-width="2"/>
  <path d="M1 48V15A14 14 0 0 1 15 1h870a14 14 0 0 1 14 14v33Z" fill="#21262d"/>
  <path d="M1 48h898" stroke="#30363d" stroke-width="2"/>

  <circle cx="25" cy="25" r="7" fill="#ff5f57"/>
  <circle cx="49" cy="25" r="7" fill="#febc2e"/>
  <circle cx="73" cy="25" r="7" fill="#28c840"/>
  <text x="450" y="30" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle">troy — zsh — MacBook-Pro</text>

  <g font-family="SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="20">
    <text x="28" y="91" fill="#7ee787">troy@MacBook-Pro</text>
    <text x="224" y="91" fill="#8b949e">~ %</text>
    <text x="271" y="91" fill="#e6edf3">echo $PURPOSE</text>

    <text x="28" y="130" fill="#e6edf3">From the exam room to the design bench —</text>
    <text x="28" y="161" fill="#e6edf3">still building for pets and the people who love them.</text>

    <text x="28" y="211" fill="#7ee787">troy@MacBook-Pro</text>
    <text x="224" y="211" fill="#8b949e">~ %</text>
    <rect x="271" y="192" width="11" height="23" rx="1" fill="#58a6ff"/>
  </g>
</svg>
